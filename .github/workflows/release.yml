name: Build version 0.3 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check bandit detect-secrets flake8
          python -m compileall -q __init__.py plugin.py
          bandit -r . --exclude ./.git -q
          detect-secrets scan --exclude-files '^\.git/' --exclude-files '\.zip$' > secrets-scan.json
          python -c 'import json; data=json.load(open("secrets-scan.json", encoding="utf-8")); assert not data.get("results"), data["results"]'
          flake8 --exclude=.git .

      - name: Build QGIS plugin package
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/color_ramp"
          mkdir -p "$package_root"
          cp __init__.py icon.png LICENSE metadata.txt plugin.py README.md "$package_root/"
          (cd package && zip -r ../color_ramp-0.3.zip color_ramp)

      - name: Validate package structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -t color_ramp-0.3.zip
          python - <<'PY'
          import configparser
          import zipfile

          archive = "color_ramp-0.3.zip"
          root = "color_ramp/"
          required_files = {root + "__init__.py", root + "metadata.txt"}
          required_keys = {
              "name", "qgisMinimumVersion", "qgisMaximumVersion", "description",
              "version", "author", "email", "about", "repository", "tracker",
              "homepage",
          }

          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              roots = {name.split("/", 1)[0] for name in names if "/" in name}
              if roots != {"color_ramp"}:
                  raise SystemExit("The ZIP must contain only the color_ramp top-level directory")
              missing_files = required_files - names
              if missing_files:
                  raise SystemExit("Missing package files: " + ", ".join(sorted(missing_files)))
              parser = configparser.ConfigParser()
              parser.optionxform = str
              parser.read_string(package.read(root + "metadata.txt").decode("utf-8-sig"))

          metadata = parser["general"]
          missing_keys = required_keys - set(metadata)
          if missing_keys:
              raise SystemExit("Missing metadata keys: " + ", ".join(sorted(missing_keys)))
          if metadata["version"] != "0.3":
              raise SystemExit("metadata.txt version must be 0.3")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag --force 0.3 "$GITHUB_SHA"
          git push origin refs/tags/0.3 --force
          notes='Version 0.3 introduces a multi-ramp editor with live RGB and RGBA previews, CSV palette import and template download, individual GPL export, combined QGIS XML export, and consistent access from the toolbar, Plugins menu and Processing Toolbox. It adds compatibility handling for QGIS 3 and QGIS 4 with Qt 5 and Qt 6, replaces the flagged XML helper with safe attribute escaping, removes unused generated UI and resource files, completes the required plugin metadata, and adds reproducible release packaging with automated Python compilation, Bandit, detect-secrets and Flake8 checks.'
          if gh release view 0.3 >/dev/null 2>&1; then
            gh release upload 0.3 color_ramp-0.3.zip --clobber
            gh release edit 0.3 --latest --title "QGIS Color Ramp Generator 0.3" --notes "$notes"
          else
            gh release create 0.3 color_ramp-0.3.zip --latest --target "$GITHUB_SHA" --title "QGIS Color Ramp Generator 0.3" --notes "$notes"
          fi
