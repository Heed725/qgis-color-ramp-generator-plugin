name: Build version 2.0 release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check bandit detect-secrets flake8
          python -m compileall -q __init__.py plugin.py
          bandit -r . --exclude ./.git -lll -q
          detect-secrets scan --exclude-files '^\.git/' --exclude-files '\.zip$' > secrets-scan.json
          python -c 'import json; data=json.load(open("secrets-scan.json", encoding="utf-8")); assert not data.get("results"), data["results"]'
          flake8 --select=F --exclude=.git .

      - name: Build QGIS plugin package
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/color_ramp"
          mkdir -p "$package_root"
          cp __init__.py icon.png LICENSE metadata.txt plugin.py README.md "$package_root/"
          (cd package && zip -r ../color_ramp-2.0.zip color_ramp)

      - name: Validate package structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -t color_ramp-2.0.zip
          python - <<'PY'
          import configparser
          import zipfile

          archive = "color_ramp-2.0.zip"
          root = "color_ramp/"
          required_files = {root + "__init__.py", root + "metadata.txt"}
          required_keys = {
              "name", "qgisMinimumVersion", "qgisMaximumVersion", "description",
              "version", "author", "email", "about", "repository", "tracker",
              "homepage",
          }

          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              roots = {name.split("/", 1)[0] for name in names if "/" in name}
              if roots != {"color_ramp"}:
                  raise SystemExit("The ZIP must contain only the color_ramp top-level directory")
              missing_files = required_files - names
              if missing_files:
                  raise SystemExit("Missing package files: " + ", ".join(sorted(missing_files)))
              parser = configparser.ConfigParser()
              parser.optionxform = str
              parser.read_string(package.read(root + "metadata.txt").decode("utf-8-sig"))

          metadata = parser["general"]
          missing_keys = required_keys - set(metadata)
          if missing_keys:
              raise SystemExit("Missing metadata keys: " + ", ".join(sorted(missing_keys)))
          if metadata["version"] != "2.0":
              raise SystemExit("metadata.txt version must be 2.0")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='Version 2.0 delivers a multi-ramp editor with live RGBA previews, CSV import and template download, individual GPL export, merged QGIS XML export, and matching toolbar and Processing Toolbox access. This release also adds QGIS 3 and QGIS 4 compatibility through Qt 5 and Qt 6 enum handling, removes unused generated UI and resource modules, completes the required repository metadata, and adds automated syntax, security, secret, and code-quality checks together with reproducible release packaging.'
          if gh release view 2.0 >/dev/null 2>&1; then
            gh release upload 2.0 color_ramp-2.0.zip --clobber
            gh release edit 2.0 --title "QGIS Color Ramp Generator 2.0" --notes "$notes"
          else
            gh release create 2.0 color_ramp-2.0.zip --target "$GITHUB_SHA" --title "QGIS Color Ramp Generator 2.0" --notes "$notes"
          fi
